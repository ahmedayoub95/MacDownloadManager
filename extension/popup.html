<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header>
      <h1>Mac Download Manager</h1>
      <div id="status" class="status">Checking app…</div>
    </header>

    <label class="row">
      <input type="checkbox" id="interceptEnabled" />
      Send browser downloads to the app
    </label>
    <label class="row">
      <input type="checkbox" id="videoButtonEnabled" />
      Show "Download this video" button
    </label>

    <div class="section-head">
      <h2>Downloads</h2>
      <a href="#" id="clearFinished">Clear finished</a>
    </div>
    <div id="jobs" class="jobs"><p class="muted">No downloads yet.</p></div>

    <h2>Media on this page</h2>
    <div id="media" class="media"><p class="muted">Nothing found yet. Play a video to detect it.</p></div>

    <footer><a href="#" id="openOptions">Settings</a></footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
