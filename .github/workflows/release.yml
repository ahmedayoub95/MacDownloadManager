name: Release

# Push a tag like v0.5.0 to build the app and publish a .dmg on the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.5.0). Creates a draft release."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Pick version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build app (Apple Silicon + Intel)
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Check the app
        run: |
          APP="dist/Mac Download Manager.app"
          lipo -archs "$APP/Contents/MacOS/MacDownloadManager"
          lipo -archs "$APP/Contents/MacOS/mdm-native-host"
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/Resources/extension/manifest.json"

      - name: Make .dmg
        run: |
          ./scripts/make-dmg.sh
          shasum -a 256 "dist/MacDownloadManager-$VERSION.dmg" | tee "dist/MacDownloadManager-$VERSION.dmg.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && DRAFT="--draft --target ${{ github.sha }}"
          gh release create "$TAG" dist/MacDownloadManager-$VERSION.dmg dist/MacDownloadManager-$VERSION.dmg.sha256 \
            --title "Mac Download Manager $VERSION" --generate-notes $DRAFT
